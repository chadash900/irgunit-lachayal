<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דוח צל״ם</title>
<meta name="theme-color" content="#465723">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="צל״ם">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E4E6DA;--surface:#F2F3EB;--ink:#1C2116;--muted:#5B6250;--line:#C6C9B8;--olive:#465723;--on-olive:#F2F3EB;--amber:#8F6210;--gray:#72786A;--danger:#9A2B1E;
--display:"Karantina","Assistant",system-ui,sans-serif;--body:"Assistant",system-ui,-apple-system,"Arial Hebrew",Arial,sans-serif;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#15180F;--surface:#1F2319;--ink:#E6E8DA;--muted:#A0A690;--line:#353A2A;--olive:#A3B865;--on-olive:#15180F;--amber:#D8A443;--gray:#8B9180;--danger:#E27461}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:560px;margin:0 auto;padding:0 18px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:12px}
.brand{font-family:var(--display);font-size:26px}
.icon{background:none;border:0;padding:10px;margin:-10px;color:var(--ink);display:grid}
.back{background:none;border:0;padding:8px 0;color:var(--olive);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link{background:none;border:0;padding:6px 0;color:var(--olive);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.ledger{padding:6px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.ledger h1{font-family:var(--display);font-weight:700;font-size:clamp(52px,16vw,76px);line-height:.95;margin:0}
.ledger p{margin:6px 0 0;color:var(--muted);font-weight:600}
.banner{background:var(--surface);border-inline-start:4px solid var(--olive);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.banner.warn{border-color:var(--amber)}
.banner p{margin:0 0 2px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 8px;margin:0 -18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;white-space:nowrap;font-weight:600;font-size:15px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.group h2{font-size:14px;color:var(--muted);font-weight:700;margin:18px 4px 6px}
.list{background:var(--surface);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:60px}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{color:var(--muted);font-weight:400}
.row-sub{font-size:14px;color:var(--muted)}
.stamp{font-family:var(--display);font-size:21px;line-height:1;padding:4px 8px 3px;border:1.5px solid currentColor;border-radius:4px;white-space:nowrap}
.s-mine{color:var(--olive)}.s-stored{color:var(--amber)}.s-returned{color:var(--gray)}
.item-head .stamp{display:inline-block;font-size:28px;transform:rotate(-3deg)}
.fab{position:fixed;left:18px;right:18px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:524px;margin:0 auto;box-shadow:0 6px 20px rgba(28,33,22,.25)}
.primary{background:var(--olive);color:var(--on-olive);border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:17px;min-height:50px}
.secondary{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--olive);color:var(--olive);border-radius:10px;padding:12px 20px;font-weight:700;min-height:50px;cursor:pointer}
.wide{width:100%}
.stack{display:grid;gap:10px;margin-top:12px}
.empty{text-align:center;padding:36px 8px}
.empty p{margin:0 0 6px}
.empty .primary{margin-top:18px}
.muted{color:var(--muted)}.small{font-size:14px}
.page-title{font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:1;margin:4px 0 10px;overflow-wrap:anywhere}
.form{display:grid;gap:14px;margin-top:14px}
.field{display:grid;gap:4px;border:0;margin:0;padding:0;min-width:0}
.field>span,.field legend{font-weight:600;font-size:15px;padding:0;margin-bottom:4px}
.field em{font-style:normal;color:var(--muted);font-weight:400}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--olive);outline:none}
.two{display:grid;grid-template-columns:1fr 1.5fr;gap:12px}
.seg{display:flex;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg-opt{flex:1;position:relative}
.seg-opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg-opt span,.seg-btn{display:block;text-align:center;padding:9px 4px;border-radius:7px;font-weight:600}
.seg-opt input:checked+span,.seg-btn.on{background:var(--ink);color:var(--bg)}
.seg-opt input:focus-visible+span{outline:2px solid var(--olive)}
.seg-btn{flex:1;background:none;border:0}
.picks{background:var(--surface);border-radius:12px;padding:10px 14px}
.picks summary{font-weight:700;cursor:pointer;padding:4px 0}
.pick-group h3{font-size:13px;color:var(--muted);margin:10px 0 6px}
.pick-row{display:flex;flex-wrap:wrap;gap:6px}
.pick-row .chip{font-size:14px;padding:5px 12px}
.form-error{color:var(--danger);margin:0}
.form-error:empty{display:none}
.block{margin:22px 0}
.block h2{font-size:15px;margin:0 0 8px}
.block p{margin:0 0 6px}
.dl{background:var(--surface);border-radius:12px;padding:4px 14px}
.dl-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.dl-row:last-child{border-bottom:0}
dt{color:var(--muted);flex-shrink:0}dd{margin:0;text-align:end;white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.thumb{aspect-ratio:1;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--surface)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.add{display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--olive);font-weight:600;font-size:14px;text-align:center;padding:6px;cursor:pointer}
.danger-link{background:none;border:0;color:var(--danger);font-weight:600;padding:12px 0;text-decoration:underline;text-underline-offset:3px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%;margin:12px 0}
.viewer-bar{display:flex;justify-content:space-between;align-items:center}
.viewer .link{color:#F0B4A8}
.install{padding-top:40px}
.steps{padding-inline-start:22px;margin:18px 0 24px}.steps li{margin-bottom:8px}
#toast{position:fixed;left:18px;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;text-align:center;font-weight:600;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.fatal{padding:40px 0}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const CATS = ['ביגוד', 'ציוד אישי', 'לחימה', 'אמר"ל', 'אחר'];
const STATUS = { mine: { l: 'אצלי' }, stored: { l: 'באפסון' }, returned: { l: 'זוכה' } };
const QUICK = {
  'ביגוד': ['מדים', 'מעיל', 'פליז', 'חולצה תרמית', 'מכנס תרמי', 'כובע גרב', 'כפפות', 'נעליים'],
  'ציוד אישי': ['שק שינה', 'מזרן', 'תיק גב', 'מימייה', 'פנס ראש', 'כלי אוכל'],
  'לחימה': ['נשק', 'מחסניות', 'וסט', 'קסדה', 'קרמי', 'מגני ברכיים'],
  'אמר"ל': ['כוונת', 'משקפת', 'אמצעי ראיית לילה', 'מכשיר קשר', 'סוללות']
};
const FROM = ['אפסנאות', 'סמל צל"ם', 'רס"פ', 'מחסן פלוגתי'];
const ICON_GEAR = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const ICON_BACK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

const app = document.getElementById('app');
let db, deferredPrompt = null, skipInstall = false, keepNext = false;
let urls = [], pendingUrls = [];
const state = { filter: 'open' };

/* ---------- עזרים ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const qtyOf = i => Math.max(1, parseInt(i.qty) || 1);
const today = () => { const t = new Date(); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); };
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('he-IL') : '';
const catOf = i => CATS.includes(i.category) ? i.category : 'אחר';
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const objUrl = blob => { const u = URL.createObjectURL(blob); pendingUrls.push(u); return u; };

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}

function render(html) {
  const y = window.scrollY;
  urls.forEach(u => URL.revokeObjectURL(u));
  urls = pendingUrls; pendingUrls = [];
  app.innerHTML = html;
  window.scrollTo(0, keepNext ? y : 0);
  keepNext = false;
}

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('tzalam', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const getAll = s => tx(s, 'readonly', st => st.getAll());
const get = (s, k) => tx(s, 'readonly', st => st.get(k));
const put = (s, v) => tx(s, 'readwrite', st => st.put(v));
const del = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const clearStore = s => tx(s, 'readwrite', st => st.clear());
const getMeta = async k => (await get('meta', k))?.v;
const setMeta = (k, v) => put('meta', { k, v });

/* ---------- מסכים ---------- */
function rowHTML(i) {
  const sub = [i.from, fmtDate(i.date)].filter(Boolean).join(', ');
  return `<button class="row" data-go="#/item/${encodeURIComponent(i.id)}">
    <div class="row-main">
      <div class="row-name">${esc(i.name)}${qtyOf(i) > 1 ? ` <span class="qty">×${qtyOf(i)}</span>` : ''}</div>
      ${sub ? `<div class="row-sub">${esc(sub)}</div>` : ''}
    </div>
    <span class="stamp s-${i.status}">${STATUS[i.status]?.l || ''}</span>
  </button>`;
}

async function viewList() {
  const items = await getAll('items');
  const lastBackup = await getMeta('lastBackup');
  const units = s => items.filter(i => i.status === s).reduce((a, i) => a + qtyOf(i), 0);
  const mine = units('mine'), stored = units('stored'), open = mine + stored;
  const f = state.filter;
  const shown = items.filter(i => f === 'open' ? i.status !== 'returned' : i.status === f);

  let banners = '';
  if (!isStandalone()) {
    banners += `<div class="banner warn"><p>האפליקציה לא מותקנת למסך הבית. באייפון הנתונים עלולים להימחק אחרי כמה ימים בלי שימוש.</p><button class="link" data-action="showInstall">איך מתקינים</button></div>`;
  }
  if (items.length) {
    const days = lastBackup ? Math.floor((Date.now() - lastBackup) / 864e5) : null;
    if (days === null || days >= 14) {
      banners += `<div class="banner"><p>${days === null ? 'עוד לא גיבית את הרשימה.' : `הגיבוי האחרון היה לפני ${days} ימים.`} אם הטלפון ילך לאיבוד, הרשימה תלך איתו.</p><button class="link" data-action="exportBackup">גיבוי עכשיו</button></div>`;
    }
  }

  const chips = [['open', 'פתוח'], ['mine', 'אצלי'], ['stored', 'באפסון'], ['returned', 'זוכה']]
    .map(([k, l]) => `<button class="chip${f === k ? ' on' : ''}" data-action="filter" data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('');

  let body;
  if (!items.length) {
    body = `<div class="empty"><p>עוד לא הוספת ציוד.</p><p class="muted">התחל ממה שחתמת עליו לאחרונה, ותוסיף את השאר כשתיזכר.</p><button class="primary" data-go="#/add">הוספת פריט ראשון</button></div>`;
  } else if (!shown.length) {
    const msg = { open: 'אין פריטים פתוחים. זוכית על הכול.', mine: 'אין פריטים שנמצאים אצלך.', stored: 'אין פריטים באפסון.', returned: 'עוד לא זוכית על כלום.' }[f];
    body = `<div class="empty"><p class="muted">${msg}</p></div>`;
  } else {
    body = CATS.map(c => {
      const g = shown.filter(i => catOf(i) === c).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      if (!g.length) return '';
      return `<section class="group"><h2>${esc(c)}</h2><div class="list">${g.map(rowHTML).join('')}</div></section>`;
    }).join('');
  }

  const headline = items.length ? `חתום על ${open} ${open === 1 ? 'פריט' : 'פריטים'}` : 'הציוד שעליו חתמת';
  render(`
    <header class="top"><span class="brand">דוח צל״ם</span><button class="icon" data-go="#/settings" aria-label="הגדרות">${ICON_GEAR}</button></header>
    <section class="ledger"><h1>${headline}</h1>${items.length ? `<p>${mine} אצלי, ${stored} באפסון</p>` : ''}</section>
    ${banners}
    ${items.length ? `<nav class="chips" aria-label="סינון לפי מצב">${chips}</nav>` : ''}
    ${body}
    ${items.length ? `<button class="fab primary" data-go="#/add">הוספת פריט</button>` : ''}
  `);
}

async function viewForm(id) {
  const it = id ? await get('items', id) : null;
  if (id && !it) { location.hash = '#/'; return; }
  const v = it || { name: '', category: 'ביגוד', qty: 1, date: today(), from: '', serial: '', status: 'mine', notes: '' };
  const back = id ? `#/item/${encodeURIComponent(id)}` : '#/';

  const picks = id ? '' : `<details class="picks" open><summary>בחירה מהירה</summary>${
    Object.entries(QUICK).map(([c, names]) => `<div class="pick-group"><h3>${esc(c)}</h3><div class="pick-row">${
      names.map(n => `<button type="button" class="chip" data-action="pick" data-name="${esc(n)}" data-cat="${esc(c)}">${esc(n)}</button>`).join('')
    }</div></div>`).join('')
  }</details>`;

  const seg = Object.entries(STATUS).map(([k, s]) =>
    `<label class="seg-opt"><input type="radio" name="status" value="${k}"${v.status === k ? ' checked' : ''}><span>${s.l}</span></label>`).join('');

  render(`
    <header class="top"><button class="back" type="button" data-go="${back}">${ICON_BACK} חזרה</button></header>
    <h1 class="page-title">${id ? 'עריכת פריט' : 'פריט חדש'}</h1>
    ${picks}
    <form id="itemForm" class="form" data-id="${esc(id || '')}" novalidate>
      <label class="field"><span>שם הפריט</span><input name="name" value="${esc(v.name)}" autocomplete="off"></label>
      <label class="field"><span>קטגוריה</span><select name="category">${CATS.map(c => `<option${catOf(v) === c ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <div class="two">
        <label class="field"><span>כמות</span><input name="qty" type="number" inputmode="numeric" min="1" value="${qtyOf(v)}"></label>
        <label class="field"><span>תאריך חתימה</span><input name="date" type="date" value="${esc(v.date)}"></label>
      </div>
      <label class="field"><span>ממי חתמת</span><input name="from" list="fromList" value="${esc(v.from)}" placeholder="לדוגמה: אפסנאות" autocomplete="off"></label>
      <datalist id="fromList">${FROM.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
      <label class="field"><span>מספר סידורי <em>לא חובה</em></span><input name="serial" dir="ltr" value="${esc(v.serial)}" autocomplete="off"></label>
      <fieldset class="field"><legend>איפה הפריט עכשיו</legend><div class="seg">${seg}</div></fieldset>
      <label class="field"><span>הערות</span><textarea name="notes" rows="3">${esc(v.notes)}</textarea></label>
      <p class="form-error" id="formError" role="alert"></p>
      <button class="primary wide" type="submit">${id ? 'שמירת שינויים' : 'הוספת פריט'}</button>
    </form>
  `);
}

async function saveForm(form) {
  const fd = new FormData(form);
  const name = (fd.get('name') || '').trim();
  if (!name) {
    form.querySelector('#formError').textContent = 'צריך לתת שם לפריט.';
    form.elements['name'].focus();
    return;
  }
  const id = form.dataset.id;
  const prev = id ? await get('items', id) : null;
  const now = Date.now();
  const it = {
    ...(prev || {}),
    id: id || uid(),
    name,
    category: fd.get('category'),
    qty: Math.max(1, parseInt(fd.get('qty')) || 1),
    date: fd.get('date') || today(),
    from: (fd.get('from') || '').trim(),
    serial: (fd.get('serial') || '').trim(),
    status: fd.get('status') || 'mine',
    notes: (fd.get('notes') || '').trim(),
    createdAt: prev?.createdAt || now,
    updatedAt: now
  };
  await put('items', it);
  toast(id ? 'השינויים נשמרו' : 'הפריט נוסף');
  location.hash = `#/item/${encodeURIComponent(it.id)}`;
}

async function viewItem(id) {
  const it = await get('items', id);
  if (!it) { location.hash = '#/'; return; }
  const photos = (await getAll('photos')).filter(p => p.itemId === id).sort((a, b) => a.createdAt - b.createdAt);
  const thumbs = photos.map(p => `<button class="thumb" data-action="viewPhoto" data-id="${esc(p.id)}" aria-label="פתיחת הצילום"><img src="${objUrl(p.blob)}" alt=""></button>`).join('');

  const rows = [
    ['כמות', String(qtyOf(it))],
    ['ממי חתמת', it.from],
    ['תאריך חתימה', fmtDate(it.date)],
    ['מספר סידורי', it.serial],
    ['הערות', it.notes]
  ].filter(r => r[1]).map(([k, val]) =>
    `<div class="dl-row"><dt>${k}</dt><dd${k === 'מספר סידורי' ? ' dir="ltr"' : ''}>${esc(val)}</dd></div>`).join('');

  const seg = Object.entries(STATUS).map(([k, s]) =>
    `<button class="seg-btn${it.status === k ? ' on' : ''}" data-action="status" data-id="${esc(id)}" data-s="${k}" aria-pressed="${it.status === k}">${s.l}</button>`).join('');

  render(`
    <header class="top"><button class="back" data-go="#/">${ICON_BACK} הציוד שלי</button><button class="link" data-go="#/edit/${encodeURIComponent(id)}">עריכה</button></header>
    <section class="item-head">
      <p class="muted" style="margin:0">${esc(catOf(it))}</p>
      <h1 class="page-title">${esc(it.name)}</h1>
      <span class="stamp s-${it.status}">${STATUS[it.status]?.l || ''}</span>
    </section>
    <section class="block"><h2>איפה הפריט עכשיו</h2><div class="seg">${seg}</div></section>
    ${rows ? `<dl class="block dl">${rows}</dl>` : ''}
    <section class="block">
      <h2>צילומים</h2>
      <p class="muted small">טופס החתימה או הפריט עצמו. זה מה שיעזור לך להוכיח על מה חתמת.</p>
      <div class="thumbs">${thumbs}<label class="thumb add"><input type="file" accept="image/*" multiple data-photo-input data-item="${esc(id)}" hidden><span>הוספת צילום</span></label></div>
    </section>
    <button class="danger-link" data-action="deleteItem" data-id="${esc(id)}">מחיקת הפריט</button>
  `);
}

async function viewSettings() {
  const last = await getMeta('lastBackup');
  let persisted = false;
  try { persisted = await navigator.storage?.persisted?.(); } catch (e) {}
  const count = (await getAll('items')).length;
  const storageNote = persisted
    ? 'הדפדפן סימן את הנתונים כמוגנים ממחיקה אוטומטית. עדיין כדאי לגבות, למקרה שהטלפון ילך לאיבוד.'
    : isStandalone()
      ? 'הדפדפן לא התחייב לשמור את הנתונים לתמיד. גבה באופן קבוע.'
      : 'האפליקציה לא מותקנת למסך הבית, והדפדפן עלול למחוק את הנתונים.';

  render(`
    <header class="top"><button class="back" data-go="#/">${ICON_BACK} הציוד שלי</button></header>
    <h1 class="page-title">הגדרות</h1>
    <section class="block">
      <h2>גיבוי</h2>
      <p>${last ? `הגיבוי האחרון: ${new Date(last).toLocaleDateString('he-IL')}` : 'עוד לא גיבית.'}</p>
      <p class="muted small">הגיבוי כולל את כל הפריטים והצילומים. שמור אותו מחוץ לטלפון, למשל בדרייב או במייל לעצמך.</p>
      <div class="stack">
        <button class="primary wide" data-action="exportBackup">גיבוי לקובץ</button>
        <label class="secondary wide">שחזור מגיבוי<input type="file" accept="application/json,.json" data-import hidden></label>
      </div>
    </section>
    <section class="block">
      <h2>איפה הנתונים נשמרים</h2>
      <p>רק בטלפון הזה. אין שרת, אין חשבון, ואף אחד אחר לא רואה את הרשימה.</p>
      <p class="muted small">${storageNote}</p>
    </section>
    ${count ? `<section class="block"><h2>מחיקה</h2><button class="danger-link" data-action="deleteAll">מחיקת כל הנתונים (${count} פריטים)</button></section>` : ''}
  `);
}

function viewInstall() {
  let steps;
  if (isIOS) {
    steps = `<ol class="steps"><li>לחץ על כפתור השיתוף בתחתית Safari</li><li>בחר ״הוספה למסך הבית״</li><li>פתח את האפליקציה מהאייקון החדש</li></ol>
      <p class="muted small">באייפון זה חייב להיות Safari.</p>`;
  } else if (deferredPrompt) {
    steps = `<div class="stack" style="margin:20px 0"><button class="primary wide" data-action="promptInstall">התקנה למסך הבית</button></div>`;
  } else {
    steps = `<ol class="steps"><li>פתח את תפריט הדפדפן (שלוש הנקודות)</li><li>בחר ״התקנת אפליקציה״ או ״הוספה למסך הבית״</li><li>פתח את האפליקציה מהאייקון החדש</li></ol>`;
  }
  render(`
    <section class="install">
      <h1 class="page-title">קודם מתקינים</h1>
      <p>הציוד שלך נשמר רק בטלפון. אם האפליקציה לא מותקנת למסך הבית, הדפדפן יכול למחוק את הרשימה אחרי כמה ימים בלי שימוש.</p>
      ${steps}
      <button class="link" data-action="continueBrowser">להמשיך בדפדפן בכל זאת</button>
    </section>
  `);
}

/* ---------- צילומים ---------- */
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file);
    const i = new Image();
    i.onload = () => { URL.revokeObjectURL(u); res(i); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); };
    i.src = u;
  });
}
async function compress(file) {
  const img = await loadImg(file);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.72));
}
async function addPhotos(input) {
  const itemId = input.dataset.item;
  const files = [...input.files];
  if (!files.length) return;
  toast('שומר צילומים…');
  let ok = 0;
  for (const f of files) {
    try {
      const blob = await compress(f);
      await put('photos', { id: uid(), itemId, blob, createdAt: Date.now() });
      ok++;
    } catch (e) {}
  }
  toast(ok === files.length ? (ok === 1 ? 'הצילום נשמר' : `${ok} צילומים נשמרו`) : `נשמרו ${ok} מתוך ${files.length}. חלק מהקבצים לא נקראו כתמונה.`);
  keepNext = true; route();
}
async function viewPhoto(pid) {
  const p = await get('photos', pid);
  if (!p) return;
  const u = URL.createObjectURL(p.blob);
  const ov = document.createElement('div');
  ov.className = 'viewer';
  ov.setAttribute('role', 'dialog');
  ov.setAttribute('aria-modal', 'true');
  ov.setAttribute('aria-label', 'צילום');
  ov.dataset.url = u;
  ov.innerHTML = `<img src="${u}" alt=""><div class="viewer-bar"><button class="link" data-action="deletePhoto" data-id="${esc(pid)}">מחיקת הצילום</button><button class="primary" data-action="closeViewer">סגירה</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.primary').focus();
}
function closeViewer() {
  const ov = document.querySelector('.viewer');
  if (ov) { URL.revokeObjectURL(ov.dataset.url); ov.remove(); }
}

/* ---------- גיבוי ---------- */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
function dataURLToBlob(d) {
  const [head, b64] = d.split(',');
  const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function exportBackup() {
  const items = await getAll('items');
  if (!items.length) { toast('אין עדיין מה לגבות'); return; }
  const photos = [];
  for (const p of await getAll('photos')) photos.push({ id: p.id, itemId: p.itemId, createdAt: p.createdAt, data: await blobToDataURL(p.blob) });
  const data = { app: 'tzalam', version: 1, exportedAt: new Date().toISOString(), items, photos };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const name = `gibui-tzalam-${today()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'גיבוי דוח צל״ם' });
      await setMeta('lastBackup', Date.now());
      toast('הגיבוי נשלח'); keepNext = true; route();
      return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  await setMeta('lastBackup', Date.now());
  toast('קובץ הגיבוי ירד'); keepNext = true; route();
}
async function importBackup(input) {
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('הקובץ לא נקרא. בחר קובץ גיבוי של דוח צל״ם.'); return; }
  if (data.app !== 'tzalam' || !Array.isArray(data.items)) { toast('זה לא קובץ גיבוי של דוח צל״ם.'); return; }
  if (!confirm(`השחזור יחליף את כל מה שיש עכשיו באפליקציה ב-${data.items.length} פריטים מהגיבוי. להמשיך?`)) return;
  try {
    await clearStore('items'); await clearStore('photos');
    for (const it of data.items) if (it && it.id && it.name) await put('items', it);
    for (const p of (data.photos || [])) {
      try { await put('photos', { id: p.id, itemId: p.itemId, createdAt: p.createdAt || Date.now(), blob: dataURLToBlob(p.data) }); } catch (e) {}
    }
    toast('השחזור הושלם');
    location.hash = '#/'; route();
  } catch (e) { toast('השחזור נכשל באמצע. נסה שוב עם אותו קובץ.'); }
}

/* ---------- אירועים ---------- */
document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]');
  if (go) { e.preventDefault(); location.hash = go.dataset.go; return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const d = a.dataset;
  switch (d.action) {
    case 'filter': state.filter = d.f; keepNext = true; route(); break;
    case 'pick': {
      const form = document.getElementById('itemForm');
      form.elements['name'].value = d.name;
      form.elements['category'].value = d.cat;
      document.querySelectorAll('[data-action="pick"].on').forEach(x => x.classList.remove('on'));
      a.classList.add('on');
      form.querySelector('#formError').textContent = '';
      break;
    }
    case 'status': {
      const it = await get('items', d.id);
      if (!it || it.status === d.s) return;
      it.status = d.s; it.updatedAt = Date.now();
      await put('items', it);
      toast(`עודכן: ${STATUS[d.s].l}`);
      keepNext = true; route();
      break;
    }
    case 'deleteItem': {
      if (!confirm('למחוק את הפריט ואת הצילומים שלו? אי אפשר לבטל.')) return;
      for (const p of (await getAll('photos')).filter(p => p.itemId === d.id)) await del('photos', p.id);
      await del('items', d.id);
      toast('הפריט נמחק');
      location.hash = '#/';
      break;
    }
    case 'viewPhoto': viewPhoto(d.id); break;
    case 'closeViewer': closeViewer(); break;
    case 'deletePhoto': {
      if (!confirm('למחוק את הצילום?')) return;
      await del('photos', d.id);
      closeViewer(); toast('הצילום נמחק');
      keepNext = true; route();
      break;
    }
    case 'exportBackup': exportBackup(); break;
    case 'deleteAll': {
      if (!confirm('למחוק את כל הפריטים והצילומים מהטלפון?')) return;
      if (!confirm('בטוח? בלי קובץ גיבוי אין דרך לשחזר.')) return;
      await clearStore('items'); await clearStore('photos');
      toast('כל הנתונים נמחקו');
      location.hash = '#/';
      break;
    }
    case 'showInstall': skipInstall = false; route(); break;
    case 'continueBrowser': skipInstall = true; route(); break;
    case 'promptInstall': {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      route();
      break;
    }
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-photo-input]')) addPhotos(e.target);
  else if (e.target.matches('[data-import]')) importBackup(e.target);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'itemForm') { e.preventDefault(); saveForm(e.target); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  if (!isStandalone() && !skipInstall) route();
});
addEventListener('appinstalled', () => toast('האפליקציה הותקנה. פתח אותה מהאייקון.'));

/* ---------- ניתוב ---------- */
async function route() {
  closeViewer();
  if (!isStandalone() && !skipInstall) return viewInstall();
  const h = location.hash.replace(/^#/, '') || '/';
  let m;
  if (h === '/') return viewList();
  if (h === '/add') return viewForm(null);
  if (h === '/settings') return viewSettings();
  if ((m = h.match(/^\/item\/(.+)$/))) return viewItem(decodeURIComponent(m[1]));
  if ((m = h.match(/^\/edit\/(.+)$/))) return viewForm(decodeURIComponent(m[1]));
  location.hash = '#/';
}

(async () => {
  try { db = await openDB(); }
  catch (e) {
    app.innerHTML = '<p class="fatal">הדפדפן חוסם שמירת נתונים. אם אתה בגלישה פרטית, פתח את האפליקציה בחלון רגיל.</p>';
    return;
  }
  try { await navigator.storage?.persist?.(); } catch (e) {}
  addEventListener('hashchange', route);
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
